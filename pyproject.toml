[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-merge-audit"
version = "1.1.0"
description = "Merge-test a repository's open pull requests together and report which combine, conflict or break each other's tests."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
pr-merge-audit = "pr_merge_audit:main"

[tool.setuptools]
py-modules = ["pr_merge_audit"]
