[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-merge-audit"
version = "2.2.1"
description = "Merge-test a repository's open pull requests together and report which combine, conflict or break each other's tests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/jacob-adm/pr-merge-audit"
Documentation = "https://github.com/jacob-adm/pr-merge-audit/tree/main/docs"
Source = "https://github.com/jacob-adm/pr-merge-audit"
Issues = "https://github.com/jacob-adm/pr-merge-audit/issues"

[project.scripts]
pr-merge-audit = "pr_merge_audit:main"

[tool.setuptools]
py-modules = ["pr_merge_audit"]
