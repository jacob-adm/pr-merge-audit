name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: python -m unittest discover -s tests
      - run: python pr_merge_audit.py verify --results tests/golden/results.json --golden tests/golden/report.md
      - run: |
          python -m pip install .
          pr-merge-audit --help

  # The package PyPI would receive: built, checked, and tested from the unpacked sdist.
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # The sdist carries the suite; it must pass from the unpacked archive too.
      - name: Tests pass from the unpacked sdist
        run: |
          mkdir sdist
          tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          cd sdist && python -m unittest discover -s tests -v
