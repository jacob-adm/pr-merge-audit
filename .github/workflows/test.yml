name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are left out while the repository is private.
        os: [ubuntu-22.04]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: python -m unittest discover -s tests
      - run: python audit.py verify --results tests/golden/results.json --golden tests/golden/report.md
      - run: |
          python -m pip install .
          pr-merge-audit --help
